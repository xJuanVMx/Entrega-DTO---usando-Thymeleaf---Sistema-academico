<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Formulario Aprendiz</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f5f5f5; }
        h1 { color: #2c3e50; }
        .card { background: white; padding: 24px; border-radius: 8px; max-width: 500px; }
        .campo { margin-bottom: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; color: #444; }
        input { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; box-sizing: border-box; }
        input:focus { outline: none; border-color: #2980b9; }
        .error { color: #e74c3c; font-size: 0.82rem; margin-top: 3px; }
        .btn-guardar { background: #27ae60; color: white; padding: 9px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.95rem; }
        .btn-volver { color: #2980b9; text-decoration: none; margin-left: 12px; }
    </style>
</head>
<body>

    <h1>📝 Formulario Aprendiz</h1>

    <div class="card">
       
        <form th:action="@{/aprendices/guardar}" th:object="${aprendiz}" method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="campo">
                <label>Nombre</label>
                <input type="text" th:field="*{nombre}" placeholder="Nombre completo"/>
                <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error"></span>
            </div>

            <div class="campo">
                <label>Correo</label>
                <input type="email" th:field="*{correo}" placeholder="correo@ejemplo.com"/>
                <span th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}" class="error"></span>
            </div>

            <div class="campo">
                <label>Programa</label>
                <input type="text" th:field="*{programa}" placeholder="Ej: Análisis y Desarrollo de Software"/>
                <span th:if="${#fields.hasErrors('programa')}" th:errors="*{programa}" class="error"></span>
            </div>

            <div class="campo">
                <label>Ficha</label>
                <input type="text" th:field="*{ficha}" placeholder="Ej: 2758369"/>
            </div>

            <button type="submit" class="btn-guardar">Guardar</button>
            <a href="/aprendices" class="btn-volver">← Volver</a>

        </form>
    </div>

</body>
</html>
